name: 'Snapcraft Build'
description: 'Build a Snapcraft project'
author: 'James Henstridge'
branding:
  icon: 'package'
  color: 'orange'
inputs:
  path:
    description: 'The location of the Snapcraft project.  Defaults to the base of the repository'
    default: '.'
  build-info:
    description: >
      Whether to include build information in the resulting snap.

      This will add snap/manifest.yaml and snap/snapcraft.yaml files
      to the snap.  The Snap Store can use this information to detect
      snaps with security vulnerabilities introduced through
      stage-packages.

      Proprietary applications may want to disable this due to
      the information leakage.
    default: 'true'
  snapcraft-channel:
    description: >
      The Snapcraft channel to use

      By default, the action will use the stable version of Snapcraft
      to build the project.  This parameter can be used to instead
      select a different channel such as beta, candidate, or edge.
    default: 'stable'
  snapcraft-args:
    description: >
      Additional arguments to pass to Snapcraft

      Some experimental Snapcraft features are disabled by default and
      must be turned on via a `--enable-experimental-*` command line
      argument.  This parameter can be used to turn on such features.
    default: ''
  ua-token:
    description: >
      UA token to attach in build environment.

      Snapcraft will detach the token when no longer required.
    default: ''
outputs:
  snap:
    description: 'The file name of the resulting snap.'
    value: ${{ steps.snapcraft-pack.outputs.snaps }}
runs:
  using: 'composite'
  steps:
    - name: suggest upgrading to canonical/craft-actions/snapcraft/pack
      shell: bash
      run: |
        echo '::warning::Please upgrade to the canonical/craft-actions/snapcraft/pack action'
    - name: snapcraft-args input is unsupported
      if: inputs.snapcraft-args != ''
      shell: bash
      run: |
        echo '::error::The snapcraft-args input parameter is no longer supported'
        exit 1
    - name: ua-token input is unsupported
      if: inputs.ua-token != ''
      shell: bash
      run: |
        echo '::error::The ua-token input parameter is no longer supported'
        exit 1
    - name: populate build-info
      if: inputs.build-info == 'true'
      shell: bash
      run: |
        # The snapcraft/pack action does not generate a manifest:
        #   https://github.com/canonical/craft-actions/issues/148
        echo "SNAPCRAFT_IMAGE_INFO={\"build_url\": \"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >> $GITHUB_ENV
        echo "SNAPCRAFT_BUILD_INFO=1" >> $GITHUB_ENV
    - name: Force LXD builds under legacy Snapcraft
      shell: bash
      run: |
        # The snapcraft/pack action does not enable LXD builds for snapcraft_legacy:
        #   https://github.com/canonical/craft-actions/issues/146
        echo "SNAPCRAFT_BUILD_ENVIRONMENT=lxd" >> $GITHUB_ENV
    - name: build the snap
      id: snapcraft-pack
      uses: canonical/craft-actions/snapcraft/pack@v1
      with:
        path: ${{ inputs.path }}
        channel: ${{ inputs.snapcraft-channel }}
