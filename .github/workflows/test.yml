name: "build-test"
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'
  schedule:
    - cron: '0 9 * * *'

jobs:
  integration: # make sure the action works on a clean machine without building
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
        channel:
          - stable
        project:
          - core22
          - core24
          - core26
        # Deprecated base snaps
        include:
          - os: ubuntu-22.04
            channel: 8.x/stable
            project: core20
          ## Snapcraft 7.x doesn't like the "--verbosity debug" argument
          #- os: ubuntu-22.04
          #  channel: 7.x/stable
          #  project: core18
    runs-on: '${{ matrix.os }}'
    steps:
    - uses: actions/checkout@v7
    - uses: ./
      id: snapcraft
      with:
        snapcraft-channel: '${{ matrix.channel }}'
        path: './test-projects/${{ matrix.project }}'
    - uses: actions/upload-artifact@v7
      with:
        name: 'snap-${{ matrix.project }}-${{ matrix.os }}'
        path: ${{ steps.snapcraft.outputs.snap}}
        compression-level: 0
        retention-days: 7

  collect-artifacts:
    needs:
      - integration
    runs-on: ubuntu-latest
    steps:
    - uses: actions/upload-artifact/merge@v7
      with:
        name: snap
        pattern: snap-*
        delete-merged: true
        retention-days: 7

  check-runner: # make sure the action works on each VM image
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            project: core22
          - os: ubuntu-24.04
            project: core24
          - os: ubuntu-26.04
            project: core26
    runs-on: '${{ matrix.os }}'
    steps:
    - uses: actions/checkout@v7
    - uses: ./
      with:
        path: './test-projects/${{ matrix.project }}'
